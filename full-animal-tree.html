function renderSug(){let v=q.value.trim().toLowerCase();sugItems=!v?nm.slice():nm.filter(n=>searchTxt[n].includes(v));sugSel=-1;sug.textContent='';if(!sugItems.length){let d=document.createElement('div');d.className='none';d.textContent='No matching taxa';sug.append(d);sug.classList.add('open');return}sugItems.forEach((n,i)=>{let row=document.createElement('div');row.className='sug-row';let a=document.createElement('span');a.textContent=n;let b=document.createElement('span');b.className='k';let m=A.find(x=>x.data.title===n);b.textContent=kindName[m&&m.data.kind]||'taxon';row.append(a,b);row.addEventListener('mousedown',e=>{e.preventDefault();choose(i)});sug.append(row)});sug.classList.add('open')}
function choose(i){let n=sugItems[i];if(!n)return;q.value=n;syncClear();filterNodes();sug.classList.remove('open');sugSel=-1;let d=A.find(x=>x.data.title===n);if(!d)return;G.classed('active',x=>x.data.title===n);let k=Math.max(d3.zoomTransform(V.node()).k,.5),tr=d3.zoomIdentity.translate(innerWidth/2-k*d.x,(innerHeight-76)/2+k*d.y).scale(k);V.call(zoom.transform,tr)}

const CHG=`<div class="chg" id="chg"><div class="chg-box"><h2>What&rsquo;s new</h2><h3>v3.2 &mdash; No more yellow arthropod borders</h3><ul><li>Arthropod entries no longer have a yellow border. Subphyla (Chelicerata, Crustacea, Hexapoda, Myriapoda) now show <strong>phylum light blue</strong> and subclasses (Acari, Cirripedia) show <strong>class light green</strong>, like every other entry of those ranks</li><li>Extinct entries now have a stronger, <strong>pure red</strong> border</li></ul><h3>v3.1 &mdash; Yellow borders for arthropod sub-ranks only</h3><ul><li>The <strong>yellow border</strong> now marks only arthropod sub-ranks: subphyla (Chelicerata, Crustacea, Hexapoda, Myriapoda) and subclasses (Acari, Cirripedia)</li><li>Arthropod classes (Insecta, Arachnida&hellip;) and orders (Coleoptera, Decapoda&hellip;) now show their normal <strong>class green</strong> and <strong>order orange</strong> borders</li></ul><h3>v3.0 &mdash; Borders keep their color</h3><ul><li>Clicking an entry no longer changes its border: extinct entries <strong>stay red</strong>, arthropod lineages <strong>stay yellow</strong>, and every other entry keeps its rank color</li><li>The selected entry is now marked with a soft <strong>white glow</strong> around the outside of its border</li></ul><h3>v2.9 &mdash; Click to highlight</h3><ul><li>Clicking any entry now turns its border <strong>white</strong> on both sites, and it stays white until you click another entry. Extinct entries keep their <strong>red border</strong> and every other entry keeps its color until clicked.</li><li>Hovering over a card no longer changes its border color</li><li>Family cards get a thicker border while selected so the white is easy to see</li></ul><h3>v2.8 &mdash; Color-coded ranks</h3><ul><li>Every rank now has its own color: <strong>kingdom yellow</strong>, <strong>phylum light blue</strong>, <strong>class light green</strong> (vertebrate lineages too), <strong>order light orange</strong>, <strong>family pink</strong>, <strong>genus/tribe/subtribe light grey</strong>, <strong>clade light brown</strong>, <strong>subphyla/subclasses inherit their parent rank color</strong>. Card text stays light-on-dark for readability.</li><li>Arthropod lineages (Hexapoda, Arachnida, Insecta, Decapoda&hellip;) now carry their true rank color plus a <strong>yellow border</strong> &mdash; e.g. Hexapoda is light blue as a subphylum</li><li>Extinct entries keep their rank color (Tyrannosaurus = grey genus, Mosasauridae = pink family&hellip;) with a bold <strong>red border</strong></li></ul><h3>v2.7 &mdash; Arthropoda re-ranked</h3><ul><li>Arthropoda is now correctly tagged as a <strong>phylum</strong> in search (it was previously labeled just &ldquo;arthropod&rdquo;). Its sub-lineages (Chelicerata, Myriapoda, Crustacea, Insecta, Arachnida&hellip;) keep their arthropod lineage coloring.</li></ul><h3>v2.6 &mdash; Accuracy &amp; readability pass</h3><ul><li>Ranks are now labeled in search: domains, kingdoms, phyla (Mollusca, Annelida, Nematoda, Chordata&hellip;), classes (Chondrichthyes, Actinopterygii, Amphibia, Scyphozoa&hellip;), and hominid ranks fixed &mdash; Gorillinae is a tribe, Panina a subtribe, Ponginae a subfamily, Homo and Orcinus genera</li><li>Elasmosaurus moved into its own family Elasmosauridae (long-necked plesiosaurs); Plesiosaurus stays under Plesiosauridae</li><li>Dinosauria, Theropoda and Maniraptora are no longer marked extinct &mdash; birds are dinosaurs, so these clades now say &ldquo;birds included&rdquo; with no dagger</li><li>Missing &ldquo;extinct&rdquo; added: Therapsida, Sphenacodontia, Mammuthus</li><li>~20 duplicate labels differentiated (e.g. hagfishes/lampreys/sea stars families now end in &ldquo;family&rdquo;); Parazoa marked as an informal sponge-grade grouping</li><li>New alias: Elasmosauridae searchable via &ldquo;elasmosaur&rdquo;</li></ul><h3>v2.5 &mdash; Early mammal added</h3><ul><li>Megazostrodon added &mdash; one of the earliest known mammaliaforms, living ~200 million years ago in the latest Triassic &amp; Early Jurassic of Africa</li><li>New stem node inserted: Cynodontia &rarr; Mammaliaformes (early mammal ancestors) &mdash; Mammalia now correctly nests inside it</li><li>Chain: Cynodontia &rarr; Mammaliaformes &rarr; {Megazostrodon (&dagger;, extinct early mammaliaform), Mammalia}</li><li>Three more famous transitionals added: Pikaia (&dagger; Cambrian basal chordate, under Chordata), Archaeopteryx (&dagger; early bird, under Maniraptora beside Aves) and Pakicetus (&dagger; extinct early whale)</li><li>Whale lineage corrected: Cetartiodactyla &rarr; Pakicetus (&dagger;, the four-legged land ancestor) &rarr; Cetacea &mdash; Pakicetus now sits on the main stem leading to all whales</li><li>Modern whales properly split into the two parvorders: Cetacea &rarr; Mysticeti (baleen whales: Balaenidae, Balaenopteridae) and Odontoceti (toothed whales: Delphinidae, Physeteridae)</li><li>Orcinus (killer whale / orca) added under Delphinidae &mdash; orcas are actually the largest dolphins, in the toothed-whale parvorder</li></ul><h3>v2.4 &mdash; Jawless vertebrates added</h3><ul><li>New branch: Vertebrata &rarr; Cyclostomata (jawless fishes) &mdash; filling the gap where the tree previously jumped straight to jawed vertebrates</li><li>Cyclostomata &rarr; Myxini (hagfishes) &rarr; Myxinidae (Atlantic hagfish) and Hyperoartia (lampreys) &rarr; Petromyzontidae (sea lamprey)</li><li>New searchable names: hagfish, slime eel, lamprey, sea lamprey, agnatha, jawless fishes</li><li>Hagfishes and lampreys are the earliest surviving vertebrates &mdash; sister lineage to all jawed vertebrates</li><li>New fossil giants: Deinosuchus (extinct basal eusuchian sister to Crocodylia &mdash; not inside Alligatoridae), Titanoboa (extinct giant boid snake, under Boidae) and Mammuthus (mammoths, under Elephantidae)</li></ul><h3>v2.3 &mdash; Echinoderms &amp; Cnidarians expanded</h3><ul><li>Echinodermata now has all 5 living classes: Asteroidea (sea stars), Ophiuroidea (brittle stars), Echinoidea (sea urchins &amp; sand dollars), Holothuroidea (sea cucumbers) and Crinoidea (sea lilies &amp; feather stars) &mdash; plus families Ophiuridae, Strongylocentrotidae, Mellitidae, Holothuriidae, Stichopodidae and Antedonidae</li><li>Cnidaria reorganized into real classes: Anthozoa (corals &amp; anemones), Scyphozoa (true jellyfish), Hydrozoa (hydras &amp; siphonophores) and Cubozoa (box jellyfish) &mdash; with new families Actiniidae (sea anemones), Cyaneidae (lion&rsquo;s mane jellies), Hydridae (freshwater hydras), Physaliidae (Portuguese man o&rsquo; war), Chirodropidae (box jellies) and Acroporidae reparented under Anthozoa</li><li>New searchable common names: sea anemone, lion&rsquo;s mane, bluebottle, sea wasp, purple sea urchin, sand dollar, crinoid, brittle stars and more</li></ul><h3>v2.2 &mdash; Layout &amp; labeling fixes</h3><ul><li>Version badge moved into the top header &mdash; it now sits beside the Reset button and can never cover a card, at any zoom level</li><li>Cards explicitly auto-grow to fit their text (no clipping); measured: zero text spills on all cards</li><li>Verified lines: Mosasauridae &rarr; Squamata, Cathartidae &rarr; new Cathartiformes &rarr; Aves</li><li>Labels tuned: Eukaryota &ldquo;domain, arising from Archaea&rdquo;, Reptilia &ldquo;all reptiles, birds included&rdquo;, Insecta &ldquo;true insects&rdquo;</li></ul><h3>v2.1 &mdash; Organization pass</h3><ul><li>Siblings sorted alphabetically left-to-right so related families sit together as visual blocks</li><li>Column spacing widened; same-row neighbors now have 185px+ clear space</li><li>Version badge introduced</li></ul><button class="chg-close" type="button" onclick="chg.classList.remove('open')">Close</button></div></div>`;
