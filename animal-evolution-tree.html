const CHG=`<div class="chg" id="chg"><div class="chg-box"><h2>What&rsquo;s new</h2><h3>v4.8 &mdash; Six extinct additions</h3><ul><li><strong>Added:</strong> <strong>&dagger; Perucetus</strong>, a colossal early whale from Peru named in 2023 and once proposed as the heaviest animal ever. It sits in Cetacea beside the baleen and toothed whales, as an early fully aquatic whale</li><li><strong>Added:</strong> <strong>&dagger; Arthropleura</strong>, the giant millipede of the Carboniferous coal forests and the largest land invertebrate known, up to about 2.6 m long. It sits under Diplopoda (millipedes) beside Julidae</li><li><strong>Added:</strong> the extinct order <strong>&dagger; Eurypterida</strong> (sea scorpions) under Chelicerata, beside the horseshoe crabs, with <strong>&dagger; Jaekelopterus</strong>, a giant Devonian sea scorpion about 2.5 m long and one of the largest arthropods that ever lived</li><li><strong>Added:</strong> <strong>&dagger; Hallucigenia</strong>, the spiny Cambrian lobopodian from the Burgess Shale, famous for first being reconstructed upside down and back to front. It sits under Onychophora (velvet worms) beside Peripatus, as an early velvet-worm relative</li><li><strong>Added:</strong> <strong>&dagger; Megalania</strong>, the giant monitor lizard of Ice Age Australia and the largest land lizard known, perhaps 5 to 7 m long. Many scientists now call it <em>Varanus priscus</em>. It sits under Varanidae (monitor lizards) beside Varanus</li><li>Navigation arrows are now neutral grey, so they suit every theme</li></ul><h3>v4.7 &mdash; Ichthyosaurs</h3><ul><li><strong>Added (9):</strong> order <strong>Ichthyosauria</strong>, the extinct fish-shaped sea reptiles, under Reptilia, with Ichthyosauridae (Ichthyosaurus), Ophthalmosauridae (Ophthalmosaurus) and the giant Shastasauridae (Shonisaurus, Shastasaurus and <strong>Ichthyotitan</strong>, a whale-sized ichthyosaur named in 2024). Where ichthyosaurs sit among reptiles is still debated</li><li>A gold <strong>&#9733;</strong> on the top-right corner now marks entries that capture a key step in evolution, like Tiktaalik, Archaeopteryx and Pakicetus. Vocab and the Colors key explain it</li><li>Cards with more than 5 branches now show <strong>one arrow with a count</strong> (like &#9650;16) that opens a list of their branches, instead of stacked rows of arrows</li></ul><h3>v4.6 &mdash; Ammonites</h3><ul><li><strong>Added (4):</strong> <strong>Ammonoidea</strong>, the extinct ammonites, as a subclass of the cephalopods, with Dactylioceras (classic ribbed Jurassic ammonite), Baculites (straight-shelled) and Parapuzosia (the largest ammonite known). Searching &ldquo;ammonite&rdquo; now finds them</li><li>The <strong>Highlight</strong> tool in the gear menu is now a dropdown that opens and closes, and shows how many highlights are on</li></ul><h3>v4.5 &mdash; Tully monster</h3><ul><li><strong>Added:</strong> <strong>Tullimonstrum</strong>, the Tully monster from Illinois. Scientists still disagree on whether it was a vertebrate, so it hangs from Bilateria with a &ldquo;placement debated&rdquo; note</li><li>Cetacea now branches off <strong>Pakicetus</strong> (Cetartiodactyla &gt; Pakicetus &gt; Cetacea), showing Pakicetus as the early whale the living whales grew out of</li><li><strong>Added:</strong> <strong>Strombidae</strong> (true conchs) under the snails, with Aliger (queen &amp; milk conchs) and Strombus (fighting &amp; pink conchs)</li><li>The Theme and Colors buttons now live in a <strong>gear menu</strong> in the header, together with a new <strong>Vocab</strong> list explaining words used on the chart, like clade, extinct, marine, tetrapod and megafauna</li><li>New <strong>Highlight</strong> tool in the gear menu: tick one or more ranks (or Extinct only) and everything else fades out, like search does. The search bar&rsquo;s &times; button resets it</li></ul><h3>v4.4 &mdash; Fish orders, giant primates &amp; marsupials</h3><ul><li><strong>Primates:</strong> Gigantopithecus (giant ape, beside the orangutans), Dinopithecus (giant baboon) and Archaeoindris in the new family Palaeopropithecidae (extinct sloth lemurs)</li><li><strong>Fish orders:</strong> Perciformes, Scombriformes, Anguilliformes, Siluriformes, Syngnathiformes, Gadiformes, Lophiiformes, Esociformes, Characiformes, Acipenseriformes, Clupeiformes, Pleuronectiformes and Gymnotiformes, plus Salmoniformes, Cypriniformes and Cichliformes, which now hold the salmon, carp and cichlid families. Coelacanths (Coelacanthiformes) and lungfishes (Dipnoi) join the lobe-finned fishes</li><li><strong>Extinct marsupials:</strong> Zygomaturus, Palorchestes (new family Palorchestidae), Phascolonus, Sthenurus, Wakaleo, Nimbacinus and the pig-footed bandicoot Chaeropus (new family Chaeropodidae). Perameles is back in its family Peramelidae now that it has a neighbour</li><li><strong>Every genus added:</strong> Archaeoindris, Gigantopithecus, Dinopithecus, Perca, Sander, Thunnus, Scomber, Anguilla, Gymnothorax, Silurus, Ictalurus, Hippocampus, Phycodurus, Gadus, Melanogrammus, Lophius, Melanocetus, Esox, Pygocentrus, Astyanax, Acipenser, Huso, Clupea, Sardina, Hippoglossus, Pleuronectes, Electrophorus, Latimeria, Neoceratodus, Protopterus, Zygomaturus, Palorchestes, Phascolonus, Sthenurus, Wakaleo, Nimbacinus, Chaeropus</li><li>The <strong>Light</strong> theme is replaced by a <strong>Dark</strong> theme</li></ul><h3>v4.3 &mdash; Pufferfish &amp; sunfish</h3><ul><li><strong>Added (10):</strong> order <strong>Tetraodontiformes</strong> under the ray-finned fishes, with Tetraodontidae (<strong>pufferfish</strong>: Takifugu, Tetraodon), Molidae (<strong>ocean sunfish</strong>: Mola), Diodontidae (porcupinefish: Diodon) and Balistidae (triggerfish: Balistes)</li></ul><h3>v4.2 &mdash; Easier to explore</h3><ul><li><strong>Navigation arrows</strong> now appear on family cards and context entries too</li><li>Hovering an arrow shows the destination&rsquo;s <strong>common name</strong> as well as its scientific name</li><li><strong>Smarter search:</strong> each word of a search is matched separately, plurals like mice, geese and wolves work, and new common-name shortcuts were added (t rex, sabertooth, sloth bear, dodo). Results still show scientific names</li><li>Click an <strong>empty space</strong> to deselect the highlighted entry</li><li>New <strong>theme selector</strong> in the header: Teal, Midnight, Charcoal, Forest or Light. Your choice is remembered</li></ul><h3>v4.1 &mdash; Reptiles, ratites &amp; tidier tree</h3><ul><li><strong>Added (67):</strong> Archosauromorpha, Prolacertiformes, Tanystropheus, Dinocephalosaurus, Prolacerta, Sharovipteryx, Longisquama, Kaprosuchus, Metriorhynchus, Sauropodomorpha, Plateosauridae, Plateosaurus, Hadrosauridae, Parasaurolophus, Edmontosaurus, Ankylosauridae, Ankylosaurus, Ceratopsidae, Torosaurus, Stegosauridae, Struthioniformes, Struthionidae, Struthio, Rheidae, Rhea, Casuariidae, Casuarius, Dromaius, Apterygidae, Apteryx, Aepyornithidae, Aepyornis, Dinornithidae, Dinornis, Cariamiformes, Cariamidae, Cariama, Phorusrhacidae, Phorusrhacos, Titanis, Sauromalus, Phelsuma, Eublepharidae, Eublepharis, Diplodactylidae, Correlophus, Chamaeleonidae, Chamaeleo, Brookesia, Agamidae, Pogona, Draco, Helodermatidae, Heloderma, Lacertidae, Lacerta, Dactyloidae, Anolis, Phrynosomatidae, Phrynosoma, Henodontidae, Henodus, Protostegidae, Archelon, Mesosauria, Mesosaurus, Stereosternum</li><li><strong>Reorganized:</strong> new <strong>Archosauromorpha</strong> now holds Archosauria, Prolacertiformes and Longisquama; Sauropoda now sits in the new <strong>Sauropodomorpha</strong> beside Plateosauridae; Triceratops moved into <strong>Ceratopsidae</strong> and Stegosaurus into <strong>Stegosauridae</strong></li><li><strong>Removed:</strong> Cynodontia (Mammaliaformes now sits directly under Therapsida), and 22 families that only repeated their class or order above and their single genus below: Peripatidae, Myxinidae, Pe  <strong>Sphyrnidae</strong>: Sphyrna; <strong>Rajidae</strong>: Raja; <strong>Dasyatidae</strong>: Dasyatis; <strong>Myliobatidae</strong>: Myliobatis; <strong>Mobulidae</strong>: Mobula; <strong>Salmonidae</strong>: Salmo, Oncorhynchus; <strong>Cyprinidae</strong>: Cyprinus, Carassius; <strong>Cichlidae</strong>: Oreochromis, Pterophyllum; <strong>Ranidae</strong>: Rana; <strong>Hylidae</strong>: Hyla; <strong>Bufonidae</strong>: Bufo, Rhinella; <strong>Dendrobatidae</strong>: Dendrobates, Phyllobates; <strong>Pipidae</strong>: Xenopus; <strong>Salamandridae</strong>: Salamandra; <strong>Ambystomatidae</strong>: Ambystoma; <strong>Plethodontidae</strong>: Plethodon; <strong>Cryptobranchidae</strong>: Andrias, Cryptobranchus; <strong>Caeciliidae</strong>: Caecilia; <strong>Typhlonectidae</strong>: Typhlonectes; <strong>Ornithorhynchidae</strong>: Ornithorhynchus; <strong>Tachyglossidae</strong>: Tachyglossus, Zaglossus; <strong>Didelphidae</strong>: Didelphis; <strong>Dasyuridae</strong>: Sarcophilus, Dasyurus; <strong>Peramelidae</strong>: Perameles; <strong>Macropodidae</strong>: Macropus; <strong>Phascolarctidae</strong>: Phascolarctos; <strong>Vombatidae</strong>: Vombatus; <strong>Petauridae</strong>: Petaurus; <strong>Canidae</strong>: Canis, Vulpes; <strong>Felidae</strong>: Panthera, Felis, Smilodon; <strong>Ursidae</strong>: Ursus, Ailuropoda; <strong>Mustelidae</strong>: Mustela, Lutra; <strong>Balaenidae</strong>: Balaena, Eubalaena; <strong>Balaenopteridae</strong>: Balaenoptera, Megaptera; <strong>Physeteridae</strong>: Physeter; <strong>Delphinidae</strong>: Tursiops; <strong>Bovidae</strong>: Bos, Ovis; <strong>Suidae</strong>: Sus; <strong>Hippopotamidae</strong>: Hippopotamus; <strong>Camelidae</strong>: Camelus, Lama; <strong>Cervidae</strong>: Cervus, Rangifer; <strong>Ponginae</strong>: Pongo; <strong>Gorillini</strong>: Gorilla; <strong>Panina</strong>: Pan; <strong>Cercopithecidae</strong>: Macaca, Papio; <strong>Hylobatidae</strong>: Hylobates; <strong>Muridae</strong>: Mus, Rattus; <strong>Sciuridae</strong>: Sciurus; <strong>Castoridae</strong>: Castor; <strong>Vespertilionidae</strong>: Myotis; <strong>Leporidae</strong>: Lepus, Oryctolagus; <strong>Ochotonidae</strong>: Ochotona; <strong>Equidae</strong>: Equus; <strong>Rhinocerotidae</strong>: Rhinoceros, Ceratotherium; <strong>Tapiridae</strong>: Tapirus; <strong>Elephantidae</strong>: Loxodonta, Elephas; <strong>Soricidae</strong>: Sorex; <strong>Erinaceidae</strong>: Erinaceus; <strong>Gorgonopsidae</strong>: Gorgonops; <strong>Ophiacodontidae</strong>: Ophiacodon; <strong>Dromaeosauridae</strong>: Deinonychus; <strong>Spinosauridae</strong>: Baryonyx; <strong>Corvidae</strong>: Corvus, Pica; <strong>Turdidae</strong>: Turdus; <strong>Paridae</strong>: Parus; <strong>Fringillidae</strong>: Fringilla; <strong>Hirundinidae</strong>: Hirundo; <strong>Cathartidae</strong>: Vultur, Cathartes; <strong>Accipitridae</strong>: Aquila, Haliaeetus; <strong>Pandionidae</strong>: Pandion; <strong>Anatidae</strong>: Anas, Branta; <strong>Columbidae</strong>: Columba, Ectopistes; <strong>Phasianidae</strong>: Gallus, Meleagris; <strong>Spheniscidae</strong>: Aptenodytes; <strong>Strigidae</strong>: Bubo; <strong>Tytonidae</strong>: Tyto; <strong>Psittacidae</strong>: Ara; <strong>Cacatuidae</strong>: Cacatua; <strong>Crocodylidae</strong>: Crocodylus; <strong>Alligatoridae</strong>: Alligator, Caiman; <strong>Gavialidae</strong>: Gavialis; <strong>Colubridae</strong>: Coluber; <strong>Viperidae</strong>: Crotalus, Vipera; <strong>Pythonidae</strong>: Python; <strong>Boidae</strong>: Boa, Eunectes; <strong>Elapidae</strong>: Naja, Dendroaspis; <strong>Iguanidae</strong>: Iguana; <strong>Gekkonidae</strong>: Gekko; <strong>Varanidae</strong>: Varanus; <strong>Scincidae</strong>: Tiliqua; <strong>Anguidae</strong>: Anguis; <strong>Testudinidae</strong>: Chelonoidis; <strong>Cheloniidae</strong>: Chelonia, Caretta; <strong>Emydidae</strong>: Trachemys; <strong>Trionychidae</strong>: Apalone; <strong>Chelydridae</strong>: Chelydra, Macrochelys; <strong>Sphenodontidae</strong>: Sphenodon; <strong>Branchiostomatidae</strong>: Branchiostoma; <strong>Ascidiidae</strong>: Ascidia; <strong>Salpidae</strong>: Salpa</li><li>Corrections found while checking: Branchiostomidae is now <strong>Branchiostomatidae</strong>, and Xiphosura is now an <strong>order</strong></li><li>Colors reworked so no two ranks look alike: order, superorder and suborder are now clearly different <strong>brighter oranges</strong>, clades are <strong>magenta</strong>, infraclass is <strong>neon lime</strong>, subtribe is <strong>sage</strong>, genus is <strong>warm taupe</strong>, and several other colors were pushed further apart</li><li>On the card site, the grey for context entries (LUCA and other eukaryotes) is now a cooler <strong>blue-grey</strong>, so it no longer looks like the genus color</li></ul><h3>v3.9 &mdash; Checked against GBIF</h3><ul><li>The moon jelly family is now <strong>Ulmaridae</strong>. Aureliidae is only a synonym, and searching for it still works</li><li><strong>Monotremata</strong> is now an order, its conventional rank</li></ul><h3>v3.8 &mdash; Full placement audit</h3><ul><li><strong>Pakicetus</strong> now branches from Cetartiodactyla as a stem whale, outside Cetacea, which holds only baleen and toothed whales</li><li><strong>Therapsida, Cynodontia and Sphenacodontia</strong> are no longer marked extinct, because they include living mammals, and Therapsida now sits inside Sphenacodontia</li><li><strong>Hylonomus</strong> moved from Amniota to Sauropsida, as an early reptile</li></ul><h3>v3.7 &mdash; Whale fix, notes and logo</h3><ul><li><strong>Cetacea</strong> now sits directly under Cetartiodactyla, with Pakicetus inside it as an early whale, instead of all whales descending from Pakicetus</li><li>Osteichthyes and Sarcopterygii are now <strong>clades</strong>, because each contains other classes</li><li>Notes added: Placozoa&rsquo;s placement is debated, and Crustacea is a paraphyletic group</li><li>The paw <strong>logo</strong> now appears in the top left corner</li><li>Both sites fit the whole tree on screen when loaded, including in narrow windows</li></ul><h3>v3.6 &mdash; Two new crustacean classes</h3><ul><li>New entries: <strong>Malacostraca</strong> (crabs, shrimp &amp; woodlice) and <strong>Thecostraca</strong> (barnacles &amp; relatives), both classes under Crustacea</li><li>Decapoda and Isopoda now sit under Malacostraca, and Cirripedia under Thecostraca, so these groups no longer skip the class level</li></ul><h3>v3.5 &mdash; Gorillini</h3><ul><li>Gorillinae is renamed <strong>Gorillini</strong>, the usual name for the gorilla tribe. Searching for the old name still finds it</li></ul><h3>v3.4 &mdash; More rank corrections</h3><ul><li>Reptilia and Cyclostomata are now <strong>clades</strong>, because each contains other classes</li><li>Onychophora and Tardigrada are <strong>phyla</strong>, Tunicata and Cephalochordata are <strong>subphyla</strong>, Asteroidea is a <strong>class</strong>, Nudibranchia is an <strong>order</strong>, and Mysticeti, Odontoceti and Sauropoda are <strong>suborders</strong></li><li>New ranks: <strong>superorder</strong> (Selachii, Batoidea) and <strong>infraclass</strong> (Monotremata, Marsupialia, Placentalia)</li><li>Both sites now show <strong>domain</strong> and <strong>kingdom</strong> colors the same way: Bacteria, Archaea and Eukaryota share a domain color, and Plantae and Fungi use the kingdom color</li></ul><h3>v3.3 &mdash; True ranks for vertebrates</h3><ul><li>The 50 entries labelled only &ldquo;vertebrate&rdquo; now show their true rank: Chordata is a <strong>phylum</strong>, Vertebrata a <strong>subphylum</strong>, Mammalia and Aves are <strong>classes</strong>, Primates and Rodentia are <strong>orders</strong>, Serpentes and Lacertilia are <strong>suborders</strong>, and Tetrapoda and Dinosauria are <strong>clades</strong></li><li>Subphylum, subclass, suborder, subfamily, tribe and subtribe each have their <strong>own color</strong>, so they no longer look the same as a neighboring rank</li><li>New <strong>Colors</strong> button in the header explains what every color means</li></ul><h3>v3.2 &mdash; No more yellow arthropod borders</h3><ul><li>Arthropod entries no longer have a yellow border. Subphyla (Chelicerata, Crustacea, Hexapoda, Myriapoda) now show <strong>phylum light blue</strong> and subclasses (Acari, Cirripedia) show <strong>class light green</strong>, like every other entry of those ranks</li><li>Extinct entries now have a stronger, <strong>pure red</strong> border</li></ul><h3>v3.1 &mdash; Yellow borders for arthropod sub-ranks only</h3><ul><li>The <strong>yellow border</strong> now marks only arthropod sub-ranks: subphyla (Chelicerata, Crustacea, Hexapoda, Myriapoda) and subclasses (Acari, Cirripedia)</li><li>Arthropod classes (Insecta, Arachnida&hellip;) and orders (Coleoptera, Decapoda&hellip;) now show their normal <strong>class green</strong> and <strong>order orange</strong> borders</li></ul><h3>v3.0 &mdash; Borders keep their color</h3><ul><li>Clicking an entry no longer changes its border: extinct entries <strong>stay red</strong>, arthropod lineages <strong>stay yellow</strong>, and every other entry keeps its rank color</li><li>The selected entry is now marked with a soft <strong>white glow</strong> around the outside of its border</li></ul><h3>v2.9 &mdash; Click to highlight</h3><ul><li>Clicking any entry now turns its border <strong>white</strong> on both sites, and it stays white until you click another entry. Extinct entries keep their <strong>red border</strong> and every other entry keeps its color until clicked.</li><li>Hovering over a card no longer changes its border color</li><li>Family cards get a thicker border while selected so the white is easy to see</li></ul><h3>v2.8 &mdash; Color-coded ranks</h3><ul><li>Every rank now has its own color: <strong>kingdom yellow</strong>, <strong>phylum light blue</strong>, <strong>class light green</strong> (vertebrate lineages too), <strong>order light orange</strong>, <strong>family pink</strong>, <strong>genus/tribe/subtribe light grey</strong>, <strong>clade light brown</strong>, <strong>subphyla/subclasses inherit their parent rank color</strong>. Card text stays light-on-dark for readability.</li><li>Arthropod lineages (Hexapoda, Arachnida, Insecta, Decapoda&hellip;) now carry their true rank color plus a <strong>yellow border</strong> &mdash; e.g. Hexapoda is light blue as a subphylum</li><li>Extinct entries keep their rank color (Tyrannosaurus = grey genus, Mosasauridae = pink family&hellip;) with a bold <strong>red border</strong></li></ul><h3>v2.7 &mdash; Arthropoda re-ranked</h3><ul><li>Arthropoda is now correctly tagged as a <strong>phylum</strong> in search (it was previously labeled just &ldquo;arthropod&rdquo;). Its sub-lineages (Chelicerata, Myriapoda, Crustacea, Insecta, Arachnida&hellip;) keep their arthropod lineage coloring.</li></ul><h3>v2.6 &mdash; Accuracy &amp; readability pass</h3><ul><li>Ranks are now labeled in search: domains, kingdoms, phyla (Mollusca, Annelida, Nematoda, Chordata&hellip;), classes (Chondrichthyes, Actinopterygii, Amphibia, Scyphozoa&hellip;), and hominid ranks fixed &mdash; Gorillinae is a tribe, Panina a subtribe, Ponginae a subfamily, Homo and Orcinus genera</li><li>Elasmosaurus moved into its own family Elasmosauridae (long-necked plesiosaurs); Plesiosaurus stays under Plesiosauridae</li><li>Dinosauria, Theropoda and Maniraptora are no longer marked extinct &mdash; birds are dinosaurs, so these clades now say &ldquo;birds included&rdquo; with no dagger</li><li>Missing &ldquo;extinct&rdquo; added: Therapsida, Sphenacodontia, Mammuthus</li><li>~20 duplicate labels differentiated (e.g. hagfishes/lampreys/sea stars families now end in &ldquo;family&rdquo;); Parazoa marked as an informal sponge-grade grouping</li><li>Tree connectors redrawn as routed elbows so lines never cross over cards</li></ul><h3>v2.5 &mdash; Early mammal added</h3><ul><li>Megazostrodon added &mdash; one of the earliest known mammaliaforms, living ~200 million years ago in the latest Triassic &amp; Early Jurassic of Africa</li><li>New stem node inserted: Cynodontia &rarr; Mammaliaformes (early mammal ancestors) &mdash; Mammalia now correctly nests inside it</li><li>Chain: Cynodontia &rarr; Mammaliaformes &rarr; {Megazostrodon (&dagger;, extinct early mammaliaform), Mammalia}</li><li>Three more famous transitionals added: Pikaia (&dagger; Cambrian basal chordate, under Chordata), Archaeopteryx (&dagger; early bird, under Maniraptora beside Aves) and Pakicetus (&dagger; extinct early whale)</li><li>Whale lineage corrected: Cetartiodactyla &rarr; Pakicetus (&dagger;, the four-legged land ancestor) &rarr; Cetacea &mdash; Pakicetus now sits on the main stem leading to all whales</li><li>Modern whales properly split into the two parvorders: Cetacea &rarr; Mysticeti (baleen whales: Balaenidae, Balaenopteridae) and Odontoceti (toothed whales: Delphinidae, Physeteridae)</li><li>Orcinus (killer whale / orca) added under Delphinidae &mdash; orcas are actually the largest dolphins, in the toothed-whale parvorder</li></ul><h3>v2.4 &mdash; Jawless vertebrates added</h3><ul><li>New branch: Vertebrata &rarr; Cyclostomata (jawless fishes) &mdash; filling the gap where the tree previously jumped straight to jawed vertebrates</li><li>Cyclostomata &rarr; Myxini (hagfishes) &rarr; Myxinidae (Atlantic hagfish) and Hyperoartia (lampreys) &rarr; Petromyzontidae (sea lamprey)</li><li>New searchable names: hagfish, slime eel, lamprey, sea lamprey, agnatha, jawless fishes</li><li>Hagfishes and lampreys are the earliest surviving vertebrates &mdash; sister lineage to all jawed vertebrates</li><li>New fossil giants: Deinosuchus (extinct basal eusuchian sister to Crocodylia &mdash; not inside Alligatoridae), Titanoboa (extinct giant boid snake, under Boidae) and Mammuthus (mammoths, under Elephantidae)</li></ul><h3>v2.3 &mdash; Echinoderms &amp; Cnidarians expanded</h3><ul><li>Echinodermata now has all 5 living classes: Asteroidea (sea stars), Ophiuroidea (brittle stars), Echinoidea (sea urchins &amp; sand dollars), Holothuroidea (sea cucumbers) and Crinoidea (sea lilies &amp; feather stars) &mdash; plus families Ophiuridae, Strongylocentrotidae, Mellitidae, Holothuriidae, Stichopodidae and Antedonidae</li><li>Cnidaria reorganized into real classes: Anthozoa (corals &amp; anemones), Scyphozoa (true jellyfish), Hydrozoa (hydras &amp; siphonophores) and Cubozoa (box jellyfish) &mdash; with new families Actiniidae (sea anemones), Cyaneidae (lion&rsquo;s mane jellies), Hydridae (freshwater hydras), Physaliidae (Portuguese man o&rsquo; war), Chirodropidae (box jellies) and Acroporidae reparented under Anthozoa</li><li>New searchable common names: sea anemone, lion&rsquo;s mane, bluebottle, sea wasp, purple sea urchin, sand dollar, crinoid, brittle stars and more</li></ul><h3>v2.2 &mdash; Layout &amp; labeling fixes</h3><ul><li>Version badge moved into the top header &mdash; it now sits beside the Reset button and can never cover a card, at any zoom level</li><li>Cards explicitly auto-grow to fit their text (no clipping); measured: zero text spills on all cards</li><li>Verified lines: Mosasauridae &rarr; Squamata, Cathartidae &rarr; new Cathartiformes &rarr; Aves</li><li>Labels tuned: Eukaryota &ldquo;domain, arising from Archaea&rdquo;, Reptilia &ldquo;all reptiles, birds included&rdquo;, Insecta &ldquo;true insects&rdquo;</li></ul><h3>v2.1 &mdash; Organization pass</h3><ul><li>Siblings sorted alphabetically left-to-right so related families sit together as visual blocks</li><li>Column spacing widened; same-row neighbors now have 185px+ clear space</li><li>Version badge introduced</li></ul><button class="chg-close" type="button" onclick="chg.classList.remove('open')">Close</button></div></div>`;

const terms=[
["Taxon (plural: taxa)","Any named group of living things, from a single genus up to a whole kingdom. Every box on this chart is a taxon."],
["Taxonomy","The science of naming living things and sorting them into groups."],
["Rank","A level of classification. From biggest to smallest: domain, kingdom, phylum, class, order, family, genus."],
["Super-, sub- and infra-","Prefixes for in-between ranks. Super- sits just above a rank (superorder), sub- just below (suborder), and infra- below sub- (infraclass)."],
["Clade","A group made of one ancestor and all of its descendants. Clades show real family branches and do not need a formal rank."],
["Common ancestor","The ancient population that two or more groups both descend from. Each branching point on the chart stands for one."],
["Paraphyletic","A traditional group that leaves out some descendants of its common ancestor, like reptiles without birds. Some boxes are labelled this way."],
["Stem group","Early extinct relatives that branched off before the living members of a group appeared, such as Pakicetus for whales."],
["Crown group","The last common ancestor of all living members of a group, plus all of its descendants."],
["Extinct (&dagger;)","No longer alive anywhere. Extinct entries have a dagger before their name and a red border."],
["Key evolutionary step (&#9733;)","A gold star marks animals that capture a major moment in evolution, such as Tiktaalik (fish moving onto land)."],
["Fossil","Preserved remains or traces of ancient life, such as bones, shells, footprints or imprints in rock."],
["Megafauna","Very large animals, especially the giant mammals of the last Ice Age such as mammoths, giant ground sloths and woolly rhinos."],
["Marine","Living in the sea."],
["Freshwater","Living in rivers, lakes and ponds."],
["Terrestrial","Living on land."],
["Vertebrate","An animal with a backbone, such as fish, amphibians, reptiles, birds and mammals."],
["Invertebrate","An animal without a backbone, such as insects, spiders, snails, worms and jellyfish."],
["Bilateral","Having a left and a right side that mirror each other. Most animals, including humans, are bilateral."],
["Tetrapod","A vertebrate with four limbs, or one descended from four-limbed ancestors: amphibians, reptiles, birds and mammals. Snakes and whales count too, even though they lost or reshaped their limbs."],
["Amniote","An animal whose eggs or embryos are protected by special membranes: reptiles, birds and mammals."],
["Placental, marsupial, monotreme","The three living kinds of mammal: placentals feed their young inside the body, marsupials carry them in a pouch, and monotremes lay eggs."],
["Scientific name","The official Latin name of a group, like Panthera. A species adds a second word, as in Panthera leo, the lion."],
["Common name","The everyday name of an animal, like lion or pufferfish. Search understands common names too."],
["Synonym","An old or alternative scientific name for the same group, such as Aureliidae for Ulmaridae."],
["Placement debated","Scientists disagree about where this group belongs on the tree, so it is placed on a branch every view agrees with."],
["LUCA","The Last Universal Common Ancestor: the earliest life form that every living thing descends from, at the root of the chart."]];
