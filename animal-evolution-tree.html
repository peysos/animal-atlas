rong> in search (it was previously labeled just &ldquo;arthropod&rdquo;). Its sub-lineages (Chelicerata, Myriapoda, Crustacea, Insecta, Arachnida&hellip;) keep their arthropod lineage coloring.</li></ul><h3>v2.6 &mdash; Accuracy &amp; readability pass</h3><ul><li>Ranks are now labeled in search: domains, kingdoms, phyla (Mollusca, Annelida, Nematoda, Chordata&hellip;), classes (Chondrichthyes, Actinopterygii, Amphibia, Scyphozoa&hellip;), and hominid ranks fixed &mdash; Gorillinae is a tribe, Panina a subtribe, Ponginae a subfamily, Homo and Orcinus genera</li><li>Elasmosaurus moved into its own family Elasmosauridae (long-necked plesiosaurs); Plesiosaurus stays under Plesiosauridae</li><li>Dinosauria, Theropoda and Maniraptora are no longer marked extinct &mdash; birds are dinosaurs, so these clades now say &ldquo;birds included&rdquo; with no dagger</li><li>Missing &ldquo;extinct&rdquo; added: Therapsida, Sphenacodontia, Mammuthus</li><li>~20 duplicate labels differentiated (e.g. hagfishes/lampreys/sea stars families now end in &ldquo;family&rdquo;); Parazoa marked as an informal sponge-grade grouping</li><li>Tree connectors redrawn as routed elbows so lines never cross over cards</li></ul><h3>v2.5 &mdash; Early mammal added</h3><ul><li>Megazostrodon added &mdash; one of the earliest known mammaliaforms, living ~200 million years ago in the latest Triassic &amp; Early Jurassic of Africa</li><li>New stem node inserted: Cynodontia &rarr; Mammaliaformes (early mammal ancestors) &mdash; Mammalia now correctly nests inside it</li><li>Chain: Cynodontia &rarr; Mammaliaformes &rarr; {Megazostrodon (&dagger;, extinct early mammaliaform), Mammalia}</li><li>Three more famous transitionals added: Pikaia (&dagger; Cambrian basal chordate, under Chordata), Archaeopteryx (&dagger; early bird, under Maniraptora beside Aves) and Pakicetus (&dagger; extinct early whale)</li><li>Whale lineage corrected: Cetartiodactyla &rarr; Pakicetus (&dagger;, the four-legged land ancestor) &rarr
